<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro da propriedade — AquaSmart</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="../cadastro/cadastro.css">
  <link rel="stylesheet" href="propriedade.css">
</head>
<body class="fundo-auth">
  <main class="cad-card prop-card">
    <div class="cad-miolo prop-miolo">
      <div id="conteudoForm">
      <h1>Cadastre sua propriedade</h1>
      <p class="sub">Informe os dados da propriedade para configurar seu sistema.</p>
      <div class="etapas">
        <span class="etapa feita"><b id="icOk"></b> Dados do proprietário</span><i class="linha"></i>
        <span class="etapa ativa"><b>2</b> Dados da propriedade</span>
      </div>
      <form id="formPropriedade" novalidate>
        <label class="campo">Nome da propriedade<input id="nome" placeholder="Digite o nome da propriedade"></label>
        <div class="par">
          <label class="campo">Localização<input id="localizacao" placeholder="Cidade - UF"></label>
          <label class="campo">Área cultivada (hectares)<input id="area" type="number" min="0.01" step="0.01" placeholder="Ex.: 2,5"></label>
        </div>
        <label class="campo">Cultura<select id="cultura"></select></label>
        <div class="campo">Modo de irrigação<div class="metodos" id="metodos"></div></div>
        <p class="erro-texto" id="erro"></p>
        <button type="submit" class="btn btn-azul btn-largo">Concluir cadastro</button>
      </form>
      </div>
      <!-- Mostrada quando o cadastro é concluído -->
      <div class="sucesso" id="sucesso" hidden>
        <span class="sucesso-icone" id="icSucesso"></span>
        <h1>Cadastro concluído!</h1>
        <p>Sua conta e sua propriedade foram criadas com sucesso. Faça login para acessar o AquaSmart.</p>
        <a class="btn btn-azul btn-largo" href="../login/login.html">Ir para o login</a>
      </div>
    </div>
  </main>
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/session.js"></script>
  <script src="../shared/js/tempo.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/demo.js"></script>
  <script src="../shared/js/analise.js"></script>
  <script src="../shared/js/mockData.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="propriedade.js"></script>
</body>
</html>
