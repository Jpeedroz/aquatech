<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Irrigações — AquaSmart</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="irrigacoes.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar"><h1 id="tituloPagina"></h1><p id="subtituloPagina"></p></header>
      <section class="conteudo">
        <div class="grade-kpi">
          <article class="card kpi"><div class="kpi-rotulo" id="r1"></div><div class="kpi-valor" id="kQtd">—</div></article>
          <article class="card kpi"><div class="kpi-rotulo" id="r2"></div><div class="kpi-valor" id="kTempo">—</div></article>
          <article class="card kpi"><div class="kpi-rotulo" id="r3"></div><div class="kpi-valor" id="kAgua">—</div></article>
          <article class="card kpi"><div class="kpi-rotulo" id="r4"></div><div class="kpi-valor" id="kVazao">—</div></article>
        </div>
        <div class="eventos-topo"><h2>Eventos recentes</h2><div id="filtro"></div></div>
        <div class="linha-tempo" id="eventos"></div>
      </section>
    </main>
  </div>
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/session.js"></script>
  <script src="../shared/js/mockData.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="irrigacoes.js"></script>
</body>
</html>
