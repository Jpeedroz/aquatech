<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha — AquaSmart</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="../cadastro/cadastro.css">
  <link rel="stylesheet" href="../recuperar/recuperar.css">
</head>
<body class="fundo-auth">
  <main class="cad-card rec-card">
    <div class="cad-miolo rec-miolo">
      <h1>Crie uma nova senha</h1>
      <p class="sub">Escolha uma nova senha para acessar sua conta no AquaSmart.</p>
      <form id="formRedefinir" novalidate hidden>
        <label class="campo">Nova senha<input type="password" id="senha" placeholder="Crie a nova senha" autocomplete="new-password"></label>
        <label class="campo">Confirmar nova senha<input type="password" id="confirmar" placeholder="Repita a nova senha" autocomplete="new-password"></label>
        <p class="erro-texto" id="erro"></p>
        <button type="submit" class="btn btn-azul btn-largo">Salvar nova senha</button>
      </form>
      <!-- Aparece quando o link é inválido, expirado ou já foi usado -->
      <div class="rec-resposta rec-invalido" id="linkInvalido" hidden>
        <p>Link inválido ou expirado.</p>
        <a href="../recuperar/recuperar.html">Solicitar um novo link</a>
      </div>
      <p class="rodape-form"><a href="../login/login.html"><strong>Voltar para o login</strong></a></p>
    </div>
  </main>
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/session.js"></script>
  <script src="../shared/js/tempo.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/demo.js"></script>
  <script src="../shared/js/analise.js"></script>
  <script src="../shared/js/mockData.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="redefinir.js"></script>
</body>
</html>
