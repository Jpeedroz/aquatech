<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico — AquaSmart</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="historico.css">
  <link rel="stylesheet" href="../shared/css/responsivo.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar"><h1 id="tituloPagina"></h1><p id="subtituloPagina"></p></header>
      <section class="conteudo">
        <div class="grade-kpi">
          <article class="card kpi"><div class="kpi-rotulo"><span id="r1"></span><em class="kpi-tag kpi-tag-periodo" id="t1">período</em></div><div class="kpi-valor" id="kUmidMedia">—</div><div class="kpi-nota" id="nUmidMedia"></div></article>
          <article class="card kpi"><div class="kpi-rotulo"><span id="r2"></span><em class="kpi-tag kpi-tag-periodo" id="t2">período</em></div><div class="kpi-valor" id="kTempMedia">—</div><div class="kpi-nota" id="nTempMedia"></div></article>
          <article class="card kpi"><div class="kpi-rotulo"><span id="r3"></span><em class="kpi-tag kpi-tag-periodo" id="t3">período</em></div><div class="kpi-valor" id="kUmidMin">—</div><div class="kpi-nota" id="nUmidMin"></div></article>
          <article class="card kpi"><div class="kpi-rotulo"><span id="r4"></span><em class="kpi-tag kpi-tag-periodo" id="t4">período</em></div><div class="kpi-valor" id="kTempMax">—</div><div class="kpi-nota" id="nTempMax"></div></article>
        </div>
        <article class="card medicoes">
          <header class="medicoes-topo">
            <div><h2 id="tituloMedicoes">Medições</h2><p class="contagem" id="contagem"></p></div>
            <div id="filtro"></div>
          </header>
          <p class="resumo-dia" id="resumoDia"></p>
          <div class="tabela-card">
            <div class="tabela-rolagem" id="tabela" aria-live="polite"></div>
          </div>
        </article>
        <div id="paginacaoDias"></div>
      </section>
    </main>
  </div>
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/session.js"></script>
  <script src="../shared/js/tempo.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/demo.js"></script>
  <script src="../shared/js/analise.js"></script>
  <script src="../shared/js/mockData.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/componentes.js"></script>
  <script src="historico.js"></script>
</body>
</html>
